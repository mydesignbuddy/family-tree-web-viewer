<div class="upload-container">
  <div class="upload-card">
    <div class="upload-header">
      <svg class="tree-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="32" cy="12" r="8" fill="#2a7d3f"/>
        <circle cx="16" cy="32" r="7" fill="#4a90d9"/>
        <circle cx="48" cy="32" r="7" fill="#d94a8e"/>
        <line x1="32" y1="20" x2="32" y2="25" stroke="#5a6c7d" stroke-width="2"/>
        <line x1="32" y1="25" x2="16" y2="32" stroke="#5a6c7d" stroke-width="2"/>
        <line x1="32" y1="25" x2="48" y2="32" stroke="#5a6c7d" stroke-width="2"/>
        <circle cx="8" cy="50" r="5" fill="#4a90d9" opacity="0.7"/>
        <circle cx="24" cy="50" r="5" fill="#d94a8e" opacity="0.7"/>
        <circle cx="40" cy="50" r="5" fill="#4a90d9" opacity="0.7"/>
        <circle cx="56" cy="50" r="5" fill="#d94a8e" opacity="0.7"/>
        <line x1="16" y1="39" x2="8" y2="50" stroke="#5a6c7d" stroke-width="1.5"/>
        <line x1="16" y1="39" x2="24" y2="50" stroke="#5a6c7d" stroke-width="1.5"/>
        <line x1="48" y1="39" x2="40" y2="50" stroke="#5a6c7d" stroke-width="1.5"/>
        <line x1="48" y1="39" x2="56" y2="50" stroke="#5a6c7d" stroke-width="1.5"/>
      </svg>
      <h1>Family Tree Viewer</h1>
      <p class="subtitle">Upload a GEDCOM file to visualize your family tree</p>
    </div>

    <div
      class="drop-zone"
      [class.dragging]="isDragging"
      [class.uploading]="isUploading"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      @if (isUploading) {
        <div class="spinner"></div>
        <p>Parsing your family tree...</p>
      } @else {
        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="17,8 12,3 7,8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="drop-text">Drag & drop your <strong>.ged</strong> file here</p>
        <p class="drop-divider">or</p>
        <label class="browse-button">
          Browse Files
          <input type="file" accept=".ged" (change)="onFileSelected($event)" hidden />
        </label>
      }
    </div>

    @if (errorMessage) {
      <div class="error-message">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#c0392b" stroke-width="2"/>
          <line x1="12" y1="8" x2="12" y2="12" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="16" r="1" fill="#c0392b"/>
        </svg>
        {{ errorMessage }}
      </div>
    }

    <div class="supported-info">
      <p>Supports GEDCOM 5.5 and 5.5.1 formats</p>
    </div>
  </div>
</div>
